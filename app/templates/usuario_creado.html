<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario Creado - CRM BAIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card-creado {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
        }
        .header-success {
            background: linear-gradient(to right, #28a745, #20c997);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .header-success i {
            font-size: 4rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .header-success h2 {
            font-weight: 900;
            margin-bottom: 0;
        }
        .body-creado {
            padding: 2rem;
        }
        .campo {
            background: #f8f9fa;
            border-left: 4px solid #28a745;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .campo .etiqueta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c757d;
            font-weight: 700;
        }
        .campo .valor {
            font-size: 1.3rem;
            font-weight: 700;
            color: #212529;
            font-family: monospace;
            word-break: break-all;
        }
        .campo .valor.password {
            color: #dc3545;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="card-creado">
        <div class="header-success">
            <i class="fas fa-check-circle"></i>
            <h2>USUARIO CREADO</h2>
            <p class="mb-0 opacity-75">con éxito</p>
        </div>
        <div class="body-creado">
            <div class="campo">
                <div class="etiqueta"><i class="fas fa-user me-1"></i> Nombre Completo</div>
                <div class="valor">{{ nombre }}</div>
            </div>
            <div class="campo">
                <div class="etiqueta"><i class="fas fa-id-card me-1"></i> Usuario (Login)</div>
                <div class="valor">{{ usuario }}</div>
            </div>
            <div class="campo">
                <div class="etiqueta"><i class="fas fa-lock me-1"></i> Contraseña</div>
                <div class="valor password">{{ password }}</div>
            </div>
            <div class="campo">
                <div class="etiqueta"><i class="fas fa-tag me-1"></i> Rol</div>
                <div class="valor">{{ rol }}</div>
            </div>

            <div class="alert alert-warning text-center small mt-3 mb-4">
                <i class="fas fa-exclamation-triangle me-1"></i>
                Guarda estos datos. La contraseña no se mostrará de nuevo.
            </div>

            <div class="d-grid gap-2">
                <a href="{{ url_for('main.admin_usuarios') }}" class="btn btn-dark fw-bold py-2">
                    <i class="fas fa-arrow-right me-1"></i> Ir a Administración de Usuarios
                </a>
                <a href="{{ url_for('main.crear_asesor') }}" class="btn btn-outline-success fw-bold">
                    <i class="fas fa-plus me-1"></i> Crear Otro Usuario
                </a>
            </div>
        </div>
    </div>
</body>
</html>
