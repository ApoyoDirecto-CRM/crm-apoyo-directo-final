{% extends "base.html" %}
{% block content %}
{% set es_admin = current_user.rol in ['GERENTE', 'SUPERVISOR'] %}

<div class="card card-contenedor p-4 shadow-lg border-0 mx-auto" style="max-width: 700px;">
    <div class="card-header bg-dark text-white rounded-3 mb-4 p-3">
        <h5 class="mb-0"><i class="fas fa-edit me-2 text-warning"></i> Editar Venta BAIT #{{ venta.id }}</h5>
    </div>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="fw-bold text-muted small">Fecha de Venta</label>
                <input type="date" name="fecha_venta" class="form-control" value="{{ venta.fecha_venta.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted small">Tipo de Venta</label>
                <select name="tipo_venta" class="form-select" required>
                    <option value="Nueva Línea" {{ 'selected' if venta.tipo_venta == 'Nueva Línea' }}>Nueva Línea</option>
                    <option value="Portabilidad" {{ 'selected' if venta.tipo_venta == 'Portabilidad' }}>Portabilidad</option>
                    <option value="Renovación" {{ 'selected' if venta.tipo_venta == 'Renovación' }}>Renovación</option>
                    <option value="Equipo Libre" {{ 'selected' if venta.tipo_venta == 'Equipo Libre' }}>Equipo Libre</option>
                    <option value="Recarga" {{ 'selected' if venta.tipo_venta == 'Recarga' }}>Recarga</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="fw-bold text-muted small">Número</label>
                <input type="text" name="numero" class="form-control" value="{{ venta.numero }}" required>
            </div>
            <div class="col-md-4">
                <label class="fw-bold text-muted small">IMEI</label>
                <input type="text" name="imei" class="form-control" value="{{ venta.imei }}" required>
            </div>
            <div class="col-md-4">
                <label class="fw-bold text-muted small">NI</label>
                <input type="text" name="ni" class="form-control" value="{{ venta.ni }}" required>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted small">Nombre(s)</label>
                <input type="text" name="cliente_nombre" class="form-control" value="{{ venta.cliente_nombre }}" required>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted small">Apellidos</label>
                <input type="text" name="cliente_apellidos" class="form-control" value="{{ venta.cliente_apellidos }}" required>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted small">Método de Contactación</label>
                <select name="metodo_contactacion" class="form-select" required>
                    <option value="Llamada" {{ 'selected' if venta.metodo_contactacion == 'Llamada' }}>Llamada</option>
                    <option value="WhatsApp" {{ 'selected' if venta.metodo_contactacion == 'WhatsApp' }}>WhatsApp</option>
                    <option value="SMS" {{ 'selected' if venta.metodo_contactacion == 'SMS' }}>SMS</option>
                    <option value="Correo" {{ 'selected' if venta.metodo_contactacion == 'Correo' }}>Correo</option>
                    <option value="Presencial" {{ 'selected' if venta.metodo_contactacion == 'Presencial' }}>Presencial</option>
                    <option value="Facebook" {{ 'selected' if venta.metodo_contactacion == 'Facebook' }}>Facebook</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted small">Vigencia del NIP</label>
                <input type="date" name="vigencia_nip" class="form-control" value="{{ venta.vigencia_nip.strftime('%Y-%m-%d') if venta.vigencia_nip else '' }}">
            </div>

            {% if es_admin and agentes %}
            <div class="col-12">
                <label class="fw-bold text-muted small">Asignar a Asesor</label>
                <select name="asesor_id" class="form-select">
                    <option value="">Sin asignar</option>
                    {% for a in agentes %}
                    <option value="{{ a.id }}" {{ 'selected' if venta.asesor_id == a.id }}>{{ a.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-warning fw-bold px-4"><i class="fas fa-save me-1"></i> Actualizar Venta</button>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary fw-bold px-4">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
