<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRM Ventas BAIT - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .brand-icon { font-size: 3rem; color: #4361ee; }
        .brand-text { color: #1a1a2e; font-weight: 900; font-size: 1.8rem; }
        .brand-sub { color: #6c757d; font-size: 0.85rem; margin-bottom: 25px; }
        .form-control { border-left: none; }
        .input-group { border: 1px solid #ced4da; border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
        .input-group:focus-within { border-color: #4361ee; box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25); }
        .input-group-text { background: transparent; border-right: none; color: #6c757d; }
        .btn-login {
            background: linear-gradient(to right, #4361ee, #3a0ca3);
            border: none; border-radius: 50px; padding: 12px; font-weight: bold; width: 100%;
        }
        .btn-login:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-sim-card brand-icon"></i>
        <h1 class="brand-text">VENTAS BAIT</h1>
        <p class="brand-sub">CRM Interno v1.0</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="text-start mb-1 ms-1 small fw-bold text-muted">Usuario</div>
            <div class="input-group"><span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="usuario" class="form-control" placeholder="Tu usuario" required>
            </div>
            <div class="text-start mb-1 ms-1 small fw-bold text-muted">Contraseña</div>
            <div class="input-group"><span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login mt-3 shadow">INICIAR SESIÓN</button>
        </form>
    </div>
</body>
</html>
